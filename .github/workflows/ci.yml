name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: dart pub publish --dry-run

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug

  ios:
    runs-on: macos-15
    steps:
      # Swift Package Manager takes a local package's identity from its folder name. The example depends on
      # the plugin by path (../), so the checkout folder must be named like the package (verifyblind_flutter),
      # as it is in the pub cache for apps that install the plugin from pub.dev.
      - uses: actions/checkout@v4
        with:
          path: verifyblind_flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-swift-package-manager
      - name: Build example for iOS (no signing)
        working-directory: verifyblind_flutter/example
        run: flutter build ios --debug --no-codesign
